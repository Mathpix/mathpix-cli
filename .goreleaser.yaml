version: 2
project_name: mpx

before:
  hooks:
    - go mod tidy

builds:
  - id: mpx
    main: .
    binary: mpx
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/mathpix/mathpix-cli/cmd.Version={{.Version}}
      - -X github.com/mathpix/mathpix-cli/cmd.Commit={{.Commit}}
      - -X github.com/mathpix/mathpix-cli/cmd.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: mpx
    name_template: "mpx_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

# macOS notarization and Windows signing are added here once the signing identities exist; until
# then the install script and the archives are unsigned, and macOS users clear the quarantine flag.
# signs / notarize go here.

# Homebrew: builds the formula but does not push it yet. To enable `brew install mathpix/tap/mpx`,
# create the Mathpix/homebrew-tap repo, give the release workflow a token that can push to it, and
# set skip_upload to false.
brews:
  - name: mpx
    skip_upload: 'true'
    repository:
      owner: Mathpix
      name: homebrew-tap
    homepage: https://mathpix.com
    description: The Mathpix command-line interface
    install: |
      bin.install "mpx"

release:
  draft: true
